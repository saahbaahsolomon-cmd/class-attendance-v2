<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USTED - Class Attendance</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#fff5f5;color:#222}
header{background:#D50000;color:white;padding:18px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.2)}
header h1{margin:0;font-size:24px}
header p{margin:4px 0 0;opacity:.9}
.container{max-width:900px;margin:16px auto;padding:0 14px}
.card{background:white;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);border-top:4px solid #D50000}
h2{margin:0 0 10px;color:#D50000;font-size:18px}
input,select{width:100%;padding:12px;margin:6px 0;border:2px solid #ddd;border-radius:8px;font-size:15px;outline:none}
input:focus,select:focus{border-color:#D50000}
button{background:#D50000;color:white;border:none;padding:12px 16px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin-top:6px;font-size:15px}
button:hover{background:#A80000}
button.green{background:#1B8C3A} button.green:hover{background:#14702E}
button.grey{background:#666}
.row{display:flex;gap:10px} .row>*{flex:1}
.student{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee}
.student b{font-size:15px}
.badge{padding:5px 10px;border-radius:20px;font-size:12px;color:white}
.present{background:#1B8C3A} .absent{background:#D50000} .late{background:#FF8A00}
.small{font-size:13px;color:#666}
.hidden{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<header>
<h1>🔴 USTED - Class Attendance</h1>
<p>University of Skills, Technology & Education Development</p>
</header>

<div class="container" id="loginPage">
<div class="card">
<h2>Welcome Lecturer / Student</h2>
<input id="userName" placeholder="Your Full Name">
<select id="userRole"><option value="Lecturer">I am a Lecturer</option><option value="Student">I am a Student</option></select>
<button onclick="login()">Enter System →</button>
<p class="small">Works for whole USTED campus. No app needed.</p>
</div>
</div>

<div class="container hidden" id="mainPage">
<div class="card topbar"><div><b id="welcomeText"></b><br><span class="small" id="dateText"></span></div><button class="grey" style="width:auto" onclick="logout()">Logout</button></div>

<div class="card">
<h2>1. Create / Open Class</h2>
<input id="groupName" placeholder="e.g. BSc IT Year 1 A">
<button onclick="createGroup()">+ Create Class</button>
<div id="groupList"></div>
</div>

<div class="card hidden" id="classCard">
<h2 id="currentClassTitle">2. Class</h2>
<input id="courseName" placeholder="Course e.g. Discrete Maths">
<input id="courseTime" placeholder="Time e.g. Mon 9am">
<button onclick="addCourse()">+ Add Course</button>
<div id="courseList"></div>
<hr>
<h2>3. Add Student</h2>
<input id="studentName" placeholder="Student Name">
<input id="studentId" placeholder="Student ID / Index Number">
<button class="green" onclick="addStudent()">+ Add Student</button>
<input id="searchBox" placeholder="🔍 Search student..." oninput="renderStudents()">
<div id="studentList"></div>
<button onclick="exportExcel()">📥 Export to Excel / CSV</button>
</div>
</div>

<script>
let user="",role="",groups=JSON.parse(localStorage.getItem('usted_groups')||'[]'),current=null;
function login(){user=document.getElementById('userName').value.trim();role=document.getElementById('userRole').value;if(!user)return alert('Enter your name');document.getElementById('loginPage').classList.add('hidden');document.getElementById('mainPage').classList.remove('hidden');document.getElementById('welcomeText').textContent=user+' ('+role+')';document.getElementById('dateText').textContent=new Date().toDateString();renderGroups();}
function logout(){location.reload();}
function save(){localStorage.setItem('usted_groups',JSON.stringify(groups));}
function createGroup(){let n=document.getElementById('groupName').value.trim();if(!n)return alert('Type class name');groups.push({name:n,courses:[],students:[]});save();document.getElementById('groupName').value='';renderGroups();}
function renderGroups(){let d=document.getElementById('groupList');d.innerHTML=groups.length?'<p class="small">Click a class to open:</p>':'';groups.forEach((g,i)=>{d.innerHTML+=`<button onclick="openGroup(${i})">📚 ${g.name} - ${g.students.length} students</button>`;});}
function openGroup(i){current=i;document.getElementById('classCard').classList.remove('hidden');document.getElementById('currentClassTitle').textContent='2. Class: '+groups[i].name;renderCourses();renderStudents();window.scrollTo(0,document.getElementById('classCard').offsetTop);}
function addCourse(){let n=document.getElementById('courseName').value.trim(),t=document.getElementById('courseTime').value.trim();if(!n)return alert('Type course');groups[current].courses.push({name:n,time:t});save();document.getElementById('courseName').value='';document.getElementById('courseTime').value='';renderCourses();}
function renderCourses(){let d=document.getElementById('courseList');d.innerHTML='';groups[current].courses.forEach(c=>{d.innerHTML+=`<div class="student"><b>${c.name}</b><span class="small">${c.time}</span></div>`;});}
function addStudent(){let n=document.getElementById('studentName').value.trim(),id=document.getElementById('studentId').value.trim();if(!n)return alert('Type student name');groups[current].students.push({name:n,id:id,status:'Absent'});save();document.getElementById('studentName').value='';document.getElementById('studentId').value='';renderStudents();}
function renderStudents(){let q=(document.getElementById('searchBox').value||'').toLowerCase();let d=document.getElementById('studentList');d.innerHTML='';groups[current].students.forEach((s,i)=>{if(!s.name.toLowerCase().includes(q)&&!s.id.toLowerCase().includes(q))return;let col=s.status=='Present'?'present':s.status=='Late'?'late':'absent';d.innerHTML+=`<div class="student"><div><b>${s.name}</b><br><span class="small">${s.id||''}</span></div><div><span class="badge ${col}">${s.status}</span><div class="row" style="margin-top:6px"><button class="green" style="padding:6px" onclick="mark(${i},'Present')">Present</button><button style="padding:6px;background:#FF8A00" onclick="mark(${i},'Late')">Late</button><button style="padding:6px" onclick="mark(${i},'Absent')">Absent</button></div></div></div>`;});}
function mark(i,st){groups[current].students[i].status=st;save();renderStudents();}
function exportExcel(){if(current===null)return;let g=groups[current];let csv='Name,ID,Status,Class,Date\n';g.students.forEach(s=>{csv+=`"${s.name}","${s.id}","${s.status}","${g.name}","${new Date().toDateString()}"\n`;});let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=g.name+'_attendance.csv';a.click();}
</script>
</body>
</html>
