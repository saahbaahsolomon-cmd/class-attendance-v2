<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USTED - Class Attendance</title>
<style>
  *{box-sizing:border-box;font-family:Arial,sans-serif}
  body{margin:0;background:#f5f0f0}
  header{background:#800000;color:white;padding:18px 15px;text-align:center}
  header img{width:90px;height:90px;object-fit:contain;background:white;border-radius:50%;padding:5px}
  header h1{margin:8px 0 2px;font-size:24px}
  header p{margin:0;opacity:.9;font-size:14px}
  .card{max-width:480px;background:white;margin:18px auto;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
  h2{color:#800000;text-align:center;margin-top:0}
  label{display:block;margin:12px 0 4px;font-weight:bold;font-size:14px}
  input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px}
  button{width:100%;background:#800000;color:white;border:0;padding:13px;border-radius:8px;font-size:16px;font-weight:bold;margin-top:16px;cursor:pointer}
  button:hover{background:#660000}
  #video{width:100%;border-radius:10px;background:#000}
  #preview{width:100%;border-radius:10px;display:none;margin-top:10px}
  .ok{background:#e6f4ea;padding:10px;border-radius:8px;text-align:center;color:#137333;margin-top:12px;display:none}
  .small{text-align:center;color:#666;font-size:13px;margin-top:10px}
</style>
</head>
<body>

<header>
  <img src="logo.png.jpg" alt="USTED Logo">
  <h1>USTED</h1>
  <p>University of Skills Training and Entrepreneurial Development<br>Class Attendance (QR + Selfie + Location)</p>
</header>

<div class="card">
  <h2>Mark Attendance</h2>
  <label>Student Name</label>
  <input id="name" placeholder="e.g. Solomon Saah">
  <label>Index Number / ID</label>
  <input id="studentId" placeholder="e.g. USTED/2024/001">
  <label>Programme</label>
  <select id="programme">
    <option>BSc Computer Science</option>
    <option>BSc Information Technology</option>
    <option>BTech</option>
    <option>Other</option>
  </select>
  <label>Course / Lecture</label>
  <input id="course" placeholder="e.g. ICT 201 - Lecture 3">
  
  <label>Selfie Photo</label>
  <video id="video" autoplay playsinline></video>
  <button type="button" id="snapBtn" style="background:#333">📸 Take Selfie</button>
  <img id="preview">
  <canvas id="canvas" style="display:none"></canvas>

  <div id="locText" class="small">Getting location...</div>
  <div id="msg" class="ok">✅ Attendance Saved!</div>
  <button id="submitBtn">Submit Attendance</button>
  <p class="small">Your photo + location prove you were in class.</p>
</div>

<script>
let stream=null, photoData="", lat="", lng="";
async function startCam(){
  try{ stream=await navigator.mediaDevices.getUserMedia({video:true}); document.getElementById('video').srcObject=stream; }catch(e){ alert('Allow camera to take selfie'); }
}
startCam();
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>{
    lat=p.coords.latitude.toFixed(6); lng=p.coords.longitude.toFixed(6);
    document.getElementById('locText').textContent="📍 Location: "+lat+", "+lng;
  },()=>{ document.getElementById('locText').textContent="Location not allowed - please allow location"; });
}
document.getElementById('snapBtn').onclick=()=>{
  let v=document.getElementById('video'), c=document.getElementById('canvas');
  c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  photoData=c.toDataURL('image/jpeg',0.7);
  let p=document.getElementById('preview'); p.src=photoData; p.style.display='block';
  alert('Selfie captured!');
};
document.getElementById('submitBtn').onclick=()=>{
  let n=document.getElementById('name').value.trim();
  let id=document.getElementById('studentId').value.trim();
  if(!n||!id){ alert('Please enter name and ID'); return; }
  if(!photoData){ alert('Please take selfie first'); return; }
  let records=JSON.parse(localStorage.getItem('usted_attendance')||'[]');
  records.push({name:n,id:id,programme:document.getElementById('programme').value,course:document.getElementById('course').value,lat:lat,lng:lng,photo:photoData,time:new Date().toLocaleString()});
  localStorage.setItem('usted_attendance',JSON.stringify(records));
  document.getElementById('msg').style.display='block';
  window.scrollTo(0,0);
};
</script>
</body>
</html>
